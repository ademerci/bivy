<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bivy</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <h1>Bivy</h1>

        <div class="items">
            <form id="itemForm">
                <label for="itemName">Name:</label>
                <input type="text" id="itemName" name="name" placeholder="Gas Kartusche" required>

                <label for="itemWeight">Gewicht (g):</label>
                <input type="number" id="itemWeight" name="weight_g" min="1" step="1" required>

                <label for="itemCategory">Kategorie:</label>
                <select id="itemCategory" name="category_id">
                    <option value="1">Schlafen</option>
                    <option value="2">Kochen</option>
                    <option value="3">Kleidung</option>
                    <option value="4">Hygiene</option>
                </select>

                <button type="submit">Hinzufügen</button>
            </form>
        </div>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
